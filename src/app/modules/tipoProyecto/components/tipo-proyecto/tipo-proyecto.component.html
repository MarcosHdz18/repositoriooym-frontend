<!--Componente card-->
<div @fadeAnimation style="margin-top: 20px; margin-bottom: 20px;">
    <mat-card class="card">
        <!--Encabezado del card-->
        <mat-card-header class="header-card">
            <!--Boton para agregar una categoria-->
            <div [ngStyle]="{ 'width.px': 80, 'height.px': 80, 'min-width.px': 80, 'min-height.px': 80 }" mat-card-avatar class="header-image"></div>

            <div class="header-content">
                <mat-card-title>Tipos de proyecto</mat-card-title>
                <mat-card-subtitle>Lista de Tipos de Proyecto</mat-card-subtitle>
            </div>

        </mat-card-header>

        <div mat-card-image></div>

        <!--Contenido de la tarjeta-->
        <mat-card-content>
            <div class="container-buscador">
                <mat-form-field style="margin-top: 20px;" appearance="outline">
                    <mat-label>Buscar tipos de proyecto</mat-label>
                    <input matInput (keyup)="filtrarTiposProyecto($event)" #input>
                    <button *ngIf="input.value" mat-icon-button matSuffix (click)="limpiarBusqueda(input)"
                        matTooltip="Limpiar búsqueda">
                        <mat-icon>close</mat-icon>
                    </button>
                    <mat-icon matSuffix *ngIf="!input.value" matTooltip="Buscar registros">search</mat-icon>
                </mat-form-field>
                <div fxLayoutAlign="flex-end">
                    <button *ngIf="isAdmin" class="button-agregar" mat-raised-button color="primary"
                        (click)="saveTipoProyectoDialog()">Nuevo tipo proyecto</button>
                    <button *ngIf="isAdmin" class="button-excel" mat-raised-button color="accent"
                        (click)="exportDataFileExcel()">Exportar a Excel</button>
                </div>
            </div>

            <div class="table-wrapper mat-elevation-z8">
                <div class="table-scroll">
                    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
                        <!--id column-->
                        <ng-container matColumnDef="idTipoProyecto">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                            <td mat-cell *matCellDef="let element">{{ element.idTipoProyecto }}</td>
                        </ng-container>
                        <!--name column-->
                        <ng-container matColumnDef="nombre">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
                            <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
                        </ng-container>
                        <!--description column-->
                        <ng-container matColumnDef="descripcion">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
                            <td mat-cell *matCellDef="let element">{{ element.descripcion }}</td>
                        </ng-container>
                        <!--actions column-->
                        <ng-container matColumnDef="acciones">
                            <th mat-header-cell *matHeaderCellDef><span *ngIf="isAdmin">Acciones</span></th>
                            <td mat-cell *matCellDef="let element; let i=index;">
                                <button *ngIf="isAdmin" matTooltip="Editar"
                                    (click)="update(element.idTipoProyecto, element.nombre, element.descripcion)"
                                    mat-icon-button color="accent">
                                    <mat-icon aria-label="Edit">edit</mat-icon>
                                </button>
                                <button *ngIf="isAdmin" matTooltip="Eliminar" (click)="delete(element)" mat-icon-button
                                    color="warn">
                                    <mat-icon aria-label="Delete">delete</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <!--Mostrar registro de las filas desplegadas-->
                        <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayColumns;" class="element-row"></tr>
                        <!--Registro no encontrado-->
                        <tr class="mat-row" *matNoDataRow>
                            <td class="mat-cell" colspan="4">No existen datos con la búsqueda proporcionada: "{{ input.value }}"
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
            <!--Paginacion-->
            <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons
                aria-label="Selecciona la página de los elementos indicados">
            </mat-paginator>
        </mat-card-content>
    </mat-card>
</div>
<app-footer></app-footer>
